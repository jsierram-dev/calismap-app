@if (available()) {
  <div class="update-banner" role="status">
    <span class="dot"></span>
    <span class="msg">{{ i18n.t('updateBanner.message') }}</span>
    <button type="button" class="update-btn" (click)="update()" [disabled]="reloading()">
      {{ reloading() ? i18n.t('updateBanner.updating') : i18n.t('updateBanner.update') }}
    </button>
  </div>
}
