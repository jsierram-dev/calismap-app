@if (available()) {
  <div class="update-banner" role="status">
    <span class="dot"></span>
    <span class="msg">Hay una actualización de la app disponible</span>
    <button type="button" class="update-btn" (click)="update()" [disabled]="reloading()">
      {{ reloading() ? 'Actualizando…' : 'Actualizar' }}
    </button>
  </div>
}
