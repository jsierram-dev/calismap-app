@if (sessionIndicator.current(); as session) {
  <button class="session-bar" type="button" (click)="goToSession()" aria-label="Volver a la sesión en curso">
    <span class="dot"></span>
    <span class="info">
      <span class="label">Sesión activa</span>
      <span class="name">{{ session.name }}</span>
    </span>
    <span class="time">{{ elapsedLabel() }}</span>
    <svg class="chevron" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="m9 18 6-6-6-6" />
    </svg>
  </button>
}
