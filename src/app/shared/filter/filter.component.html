<div class="sheet-backdrop" [class.open]="open" (click)="close()"></div>
<div class="sheet" [class.open]="open" role="dialog" aria-label="Filtrar por músculo">
  <div class="sheet-grip"></div>
  <div class="sheet-header">
    <h3>Filtrar por músculo</h3>
    <button type="button" (click)="close()" aria-label="Cerrar">
      <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="sheet-body">
    @for (region of regions; track region.label) {
      <div class="muscle-group">
        <p class="muscle-group-label">{{ region.label }}</p>
        <div class="muscle-grid">
          @for (muscle of region.muscles; track muscle.value) {
            <label class="muscle-option">
              <input type="checkbox" [checked]="isChecked(muscle.value)" (change)="toggle(muscle.value)" />
              <span class="tile">
                <span class="box">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                </span>
                {{ muscle.label }}
              </span>
            </label>
          }
        </div>
      </div>
    }
  </div>

  <div class="sheet-footer">
    <button class="btn btn-ghost" type="button" (click)="clear()">Limpiar</button>
    <button class="btn btn-primary" type="button" (click)="apply()">Aplicar ({{ selectedCount() }})</button>
  </div>
</div>
