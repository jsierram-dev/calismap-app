<div class="sheet-backdrop" [class.open]="open" (click)="close()"></div>
<div class="sheet" [class.open]="open" role="dialog" [attr.aria-label]="i18n.t('filter.title')">
  <div class="sheet-grip"></div>
  <div class="sheet-header">
    <h3>{{ i18n.t('filter.title') }}</h3>
    <button type="button" (click)="close()" [attr.aria-label]="i18n.t('filter.closeAria')">
      <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 6 6 18M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="sheet-body">
    @for (region of regions; track region.regionKey) {
      <div class="muscle-group">
        <p class="muscle-group-label">{{ i18n.t('enums.region.' + region.regionKey) }}</p>
        <div class="muscle-grid">
          @for (muscle of region.muscles; track muscle) {
            <label class="muscle-option">
              <input type="checkbox" [checked]="isChecked(muscle)" (change)="toggle(muscle)" />
              <span class="tile">
                <span class="box">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4">
                    <path d="M20 6 9 17l-5-5" />
                  </svg>
                </span>
                {{ i18n.t('enums.muscle.' + muscle) }}
              </span>
            </label>
          }
        </div>
      </div>
    }
  </div>

  <div class="sheet-footer">
    <button class="btn btn-ghost" type="button" (click)="clear()">{{ i18n.t('filter.clear') }}</button>
    <button class="btn btn-primary" type="button" (click)="apply()">{{ i18n.t('filter.apply', { count: selectedCount() }) }}</button>
  </div>
</div>
