<div class="page-content">
  <h1 class="screen-title">Ejercicios</h1>
  <p class="screen-sub">{{ filtered().length }} ejercicios del catálogo</p>

  <app-search placeholder="Buscar ejercicio..." [query]="query()" (queryChange)="query.set($event)" [filterCount]="selectedMuscles().length" (filterClick)="filterOpen.set(true)" />

  <a class="new-btn" routerLink="/admin/exercises/new">
    <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
    Nuevo ejercicio
  </a>

  @for (exercise of filtered(); track exercise.id) {
    <a class="ex-row" [routerLink]="['/admin/exercises', exercise.id, 'edit']">
      <div class="info">
        <h4>{{ exercise.name }}</h4>
        <div class="tags">
          <span class="tag">{{ exercise.category }}</span>
          <span class="tag">{{ exercise.level }}</span>
        </div>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
    </a>
  } @empty {
    <p class="empty-note">No encontramos ningún ejercicio con ese criterio.</p>
  }
</div>

<app-filter [open]="filterOpen()" (closed)="filterOpen.set(false)" (applied)="onMusclesApplied($event)" />
