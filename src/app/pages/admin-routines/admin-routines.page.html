<div class="page-content">
  <h1 class="screen-title">Rutinas</h1>
  <p class="screen-sub">{{ routines().length }} rutinas oficiales</p>

  <a class="new-btn" routerLink="/admin/routines/new">
    <svg class="icon" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" fill="none" stroke-linecap="round"><path d="M12 5v14M5 12h14" /></svg>
    Nueva rutina
  </a>

  @for (routine of routines(); track routine.id) {
    <a class="routine-row" [routerLink]="['/admin/routines', routine.id, 'edit']">
      <div class="info">
        <h4>{{ routine.name }}</h4>
        <p>{{ routine.description }}</p>
      </div>
      <svg class="chevron" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6" /></svg>
    </a>
  } @empty {
    <p class="empty-note">No hay rutinas todavía.</p>
  }
</div>
