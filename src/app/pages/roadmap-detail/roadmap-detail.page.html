@if (detail(); as d) {
  <div class="page-content">
    <span class="tag">{{ d.roadmap.category }}</span>
    <h1 class="screen-title">{{ d.roadmap.name }}</h1>
    <p class="screen-sub">{{ d.completedCount }} de {{ d.totalCount }} pasos completados</p>

    <app-route [nodes]="nodes()" />
  </div>
}
