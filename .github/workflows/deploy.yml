# Build + deploy a GitHub Pages (ver ROADMAP-calismap.md, "Despliegue") —
# mismo patrón ya probado con mudanza-app. Project site (vive en
# /calismap-app/, no en la raíz), de ahí el --base-href. Sin efecto hasta
# habilitar "Settings → Pages → Source: GitHub Actions" en el repo (paso
# manual, no lo hace este workflow) y hasta que el repo sea público (Pages
# gratis no sirve repos privados).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # v5+ (18/08/2026) — v4 corre sobre Node 20, que GitHub Actions dejó de
      # soportar (deprecation forzada a Node 24, ver
      # https://github.blog/changelog/2025-09-19-deprecation-of-node-20-on-github-actions-runners/).
      # v5 es la primera versión de cada una que corre nativo en Node 24.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: '@jsierram-dev'
      # @jsierram-dev/jp-user-kit (18/08/2026, ver ROADMAP-calismap.md "Foto
      # de usuario real") se publica en GitHub Packages, no en el registro
      # público de npm — sin login ahí, `npm ci` no puede resolverlo y el
      # build falla (exit code 1, sin más detalle en el log). Localmente
      # funcionaba porque el `.npmrc` global de la máquina de desarrollo ya
      # tenía el scope + token configurados; un runner de CI arranca sin
      # eso. Mismo patrón ya resuelto en mudanza-app (ver su .github/
      # workflows/deploy.yml y .npmrc) — el GITHUB_TOKEN automático NO
      # alcanza: solo lee paquetes del MISMO repo, y jp-user-kit se publica
      # desde jp-libraries, un repo distinto (aunque del mismo dueño). Hace
      # falta un PAT real con permiso read:packages, guardado como secret
      # del repo — ver JP_PACKAGES_TOKEN más abajo.
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.JP_PACKAGES_TOKEN }}
      - run: npx ng build --configuration production --base-href /calismap-app/
      # GitHub Pages no sabe nada del router de Angular (routing por path, no
      # hash) — sin esto, refrescar o entrar directo a una URL como
      # /calismap-app/roadmaps/x da 404 en vez de dejar que el router la
      # resuelva del lado del cliente. Truco estándar de SPA en Pages: servir
      # el mismo shell como 404.html.
      - run: cp dist/calismap-app/browser/index.html dist/calismap-app/browser/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/calismap-app/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
